- layout: top-middle
  name: Unity Managers Framework
  github: min-omniai/lec-unity-managers-arch
  quote: >
    MondayOFF에서 설계한 인하우스 공통 구조를 Unity 6 코드 샘플로 재구성
  description: | # this will include new lines to allow paragraphs
    * <mark>Managers 단일 진입점</mark> + `ISubManager` 아래 Resource·Pool·Audio·Data·UI 매니저 분리
    * UI_Base 컴포넌트 바인딩(GetObject·GetImage·GetButton·GetText)으로 중첩 UI 접근 단순화, Popup 스택 관리
    * Stack 기반 Object Pool, GetOrAddComponent·WaitForSeconds 캐싱 등 공용 유틸
    * 실무판은 팀 프로젝트에 적용해 신작 초기 세팅 비용을 줄이고, 사용법을 Notion 개발 위키로 문서화
    * 공개판은 "왜 이 구조가 필요한가"를 메모리 → 생명주기 → Singleton → Managers 순 6강으로 설명 (C# 19파일)
