- layout: top-middle
  name: 8팀 리스크 자동 추적 시스템
  link: https://min-omniai.github.io/ops-risk-dashboard/
  github: min-omniai/ops-risk-dashboard
  quote: >
    매일 정규 수업 2교시가 들어가던 구두 브리핑을 규칙 기반 자동 판정으로 대체
  description: | # this will include new lines to allow paragraphs
    * 8개 팀의 일일 진행 상황을 GSheet 스키마(작업현황 원문·운영 리스크·운영진 피드백·구조화 판단)로 역할 분리
    * 지연율·작업량 편중·D-Day 경과·연속 미제출을 자동 판정하는 <mark>규칙 6종을 코딩 전에 문서로 고정</mark>
    * 이 설계를 Claude Code·Codex에 지시해 React·TypeScript·Supabase 웹 대시보드로 구현, Google Apps Script로 시트와 자동 동기화
    * GPT 분류 값은 <mark>등급 4종·위험유형 7종</mark>으로 허용값을 고정해 구조화 붕괴 방지
    * 생성한 수치는 결정론적 코드로 재계산해 대조하되, 검증기는 고치지 않고 <mark>보고만</mark> 하게 설계
