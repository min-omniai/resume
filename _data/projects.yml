- layout: top-middle
  name: 인하우스 Unity Framework
  quote: >
    팀 개발 환경 개선을 위해 설계한 공통 구조 — MondayOFF 실무 산출물
  description: | # this will include new lines to allow paragraphs
    * <mark>Managers 허브</mark>로 하위 매니저(Data·Pool·Resource·Scene·Sound·UI)를 통합 접근
    * UI_Base에 컴포넌트 바인딩(GetObject·GetImage·GetButton·GetText)을 두어 중첩 UI 접근 단순화
    * <mark>Stack 기반 Object Pool</mark>로 반복 생성·파괴 비용 절감
    * GetOrAddComponent·WaitForSeconds 캐싱 등 공용 유틸·확장 메서드 제공
    * 팀 프로젝트에 적용해 신규 프로젝트 초기 세팅 비용을 줄임

- layout: top-middle
  name: Unity Architecture Guide
  github: min-omniai/lec-unity-managers-arch
  quote: >
    실무에서 만든 구조를 "왜 필요한가"부터 설명 가능한 형태로 재구성 (Unity 6)
  description: | # this will include new lines to allow paragraphs
    * 메모리 영역(static·Stack·Heap·GC) → Object와 Instance → MonoBehaviour 생명주기 → static과 Singleton → <mark>Managers 구조와 책임 분리</mark> 순으로 6강 설계
    * 구조를 먼저 제시하지 않고, Instantiate가 여러 스크립트에 흩어져 생성·파괴 추적이 안 되는 상황부터 보여준 뒤 개념을 <mark>역으로 유도</mark>
    * 각 절을 "왜 다음 개념이 등장했는가"로 닫아 개념을 사슬로 연결
    * 교안을 문서로만 두지 않고 실행 가능한 코드 저장소로 병행 관리

