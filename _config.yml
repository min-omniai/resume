  <mark>성능 최적화 · 구조 설계 · 업무 툴 개발</mark>을 해온 Unity 클라이언트 개발자입니다.

  * **출시 성과** — MondayOFF 3년 11개월 동안 모바일 게임 14종 출시. 글로벌 서비스 흑자 전환(Match Gun 3D),
    Day2 ROAS 130%(TankBall!), 자사 첫 누적 유저 100만(TimeWalker 3D)에 기여했습니다.
  * **구조 설계** — 팀이 쓰는 인하우스 Unity Framework(Managers · Object Pool · UI_Base)를 설계해
    신작 초기 세팅 비용을 줄였습니다.
  * **최적화 · 출시 대응** — 프로파일러 기반 메모리·드로우콜 최적화, 광고 SDK·IAP 연동,
    iOS/Android 빌드와 라이브 업데이트를 맡았습니다.
  * **최근 1년** — XR/Unity KDT 강사로 Unity 응용·인터랙티브 136시수를 강의하고,
    8개 게임 팀을 Google Play 출시까지 운영했습니다. 수강 만족도 4.4 / 5.0.
  * **툴 개발** — 반복되는 병목은 도구로 풀었습니다. 판정 규칙과 데이터 구조는 직접 설계하고,
    구현은 AI에 맡기고, 결과는 코드로 다시 검증합니다.

  원칙은 하나입니다 — <mark>구현은 위임하되, 판정 기준과 검증은 내가 쥔다.</mark>

